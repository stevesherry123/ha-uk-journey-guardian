travel_review_now:
  name: Travel review now
  description: Refresh the calendar, station access and eligible live rail data, then send a travel briefing. Repeated taps within 30 seconds reuse the result.
  fields:
    notify:
      name: Send briefing
      description: Send the summary through the configured announcement script and keep the full report in Home Assistant. Disable for response-only use.
      default: true
      selector:
        boolean:

review_now:
  name: Review journey now
  description: Immediately refresh the calendar and UK Journey Guardian decision path.

review_rail_now:
  name: Check live rail now
  description: Explicitly check the selected rail provider for the current calendar journey. This can consume provider allowance.

simulate_journey:
  name: Simulate journey
  description: Activate a deterministic journey scenario without contacting live providers or consuming provider allowance.
  fields:
    scenario:
      name: Scenario
      description: Synthetic rail condition to apply until simulation is cleared or Home Assistant restarts.
      required: true
      selector:
        select:
          options:
            - on_time
            - delayed
            - cancelled
            - split_on_time
            - stale_data
            - provider_unavailable
    departure_in_minutes:
      name: Departure in minutes
      description: Minutes from now to the synthetic scheduled departure.
      default: 180
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    delay_minutes:
      name: Delay minutes
      description: Delay applied by the delayed scenario; ignored by other scenarios.
      default: 15
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
          mode: box
    duration_minutes:
      name: Journey duration
      description: Duration of the synthetic journey after its effective departure.
      default: 60
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
          mode: box
    accelerated:
      name: Accelerated timeline
      description: Use two-minute preparation and access stages plus a one-minute station buffer for rapid end-to-end testing.
      default: false
      selector:
        boolean:

clear_simulation:
  name: Clear simulation
  description: Return Journey Guardian to its configured calendar source. No provider call is made.

confirm_connection:
  name: Confirm booked connection
  description: Confirm two adjacent current rail bookings as a connection. Development feature; does not enable live connection warnings.
  fields:
    inbound_id:
      name: Incoming booking ID
      required: true
      selector:
        text:
    outbound_id:
      name: Onward booking ID
      required: true
      selector:
        text:
    override_minutes:
      name: Transfer allowance override
      description: Optional allowance for this booked pair, in minutes.
      selector:
        number:
          min: 0
          max: 1440
          mode: box

revoke_connection:
  name: Revoke booked connection
  description: Remove a saved confirmation without changing either calendar booking.
  fields:
    inbound_id:
      name: Incoming booking ID
      required: true
      selector:
        text:
    outbound_id:
      name: Onward booking ID
      required: true
      selector:
        text:

review_recovery:
  name: Review rail recovery options
  description: Search from your confirmed current station to the final booking in a confirmed connected journey.
  fields:
    affected_booking_id:
      name: Affected booking ID
      required: true
      selector:
        text:
    final_booking_id:
      name: Final booking ID
      required: true
      selector:
        text:
    origin:
      name: Confirmed current station name
      required: true
      selector:
        text:

select_recovery:
  name: Recheck a recovery route
  description: Recheck a reviewed route and prepare its approval preview.
  fields:
    option_id:
      name: Reviewed route ID
      required: true
      selector:
        text:
    revision:
      name: Reviewed route revision
      required: true
      selector:
        text:
