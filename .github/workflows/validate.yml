name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test tools
        run: python -m pip install --upgrade pytest ruff

      - name: Lint
        run: ruff check .

      - name: Compile integration
        run: python -m compileall custom_components/journey_guardian

      - name: Test
        run: pytest

      - name: Scan for committed secrets and installation identifiers
        run: python scripts/privacy_scan.py
