<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Journey Guardian development preview</title>
  <style>
    body{margin:0;background:#f1f4f4;color:#202322;font:14px/1.5 system-ui;letter-spacing:0}
    main{max-width:850px;margin:24px auto;padding:0 16px}
    header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
    h1{font-size:17px;margin:0}
    select{padding:8px;font:inherit;border:1px solid #bac3c5;border-radius:4px;background:#fff;max-width:100%}
    label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .note{color:#5d6568;margin:8px 0 16px}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Journey Guardian / development</h1>
      <label>Scenario
        <select id="scenario">
          <option value="normal">Waze preferred</option>
          <option value="google">Google recovery</option>
          <option value="constant">Both providers unavailable</option>
          <option value="disabled">Notifications disabled</option>
          <option value="awake">Awake evidence recorded</option>
          <option value="cancelled">Cancelled service</option>
          <option value="stale">Retained calendar data</option>
          <option value="overnight">Overnight journey</option>
          <option value="clock-change">Clocks go back</option>
          <option value="long">Long station name</option>
          <option value="empty">No journey</option>
          <option value="unavailable">HA unavailable</option>
        </select>
      </label>
    </header>
    <p class="note">Fictional data. Read-only preview, not connected to Home Assistant.</p>
    <journey-guardian-card></journey-guardian-card>
  </main>
  <script type="module">
    import './journey-guardian-card.js';
    import {previewData} from './preview-data.js';
    const card = document.querySelector('journey-guardian-card');
    card.setConfig({entity:'sensor.example_journey_status'});
    const now = Date.now();
    const select = document.getElementById('scenario');
    const update = () => { card.hass = previewData(select.value, now); };
    select.addEventListener('change', update);
    update();
  </script>
</body>
</html>
